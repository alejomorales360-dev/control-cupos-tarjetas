<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f2937">
<title>Control de Cupos</title>
<meta http-equiv="refresh" content="1; url=https://script.google.com/macros/s/AKfycbzgnO_XkgR7M3a0NvPdXJQdgw2OnagwxV7ILM4PLo2y-6NbU4e3v3u4-NYA966dWBnc/exec">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💳</text></svg>">
<style>
  :root { --bg: #f4f5f7; --card: #fff; --text: #111827; --muted: #6b7280; --primary: #1f2937; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8; --primary: #3b82f6; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text);
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  main { background: var(--card); border-radius: 16px; padding: 32px 24px; max-width: 380px; width: 100%; text-align: center; }
  .logo { font-size: 48px; }
  h1 { margin: 8px 0 4px; font-size: 22px; }
  p { color: var(--muted); margin: 0 0 24px; }
  a.btn { display: block; background: var(--primary); color: #fff; text-decoration: none; padding: 14px; border-radius: 10px; font-weight: 600; }
  .sub { font-size: 13px; margin: 16px 0 0; }
</style>
</head>
<body>
<main>
  <div class="logo">💳</div>
  <h1>Control de Cupos</h1>
  <p>Abriendo la app…</p>
  <a class="btn" id="go" href="https://script.google.com/macros/s/AKfycbzgnO_XkgR7M3a0NvPdXJQdgw2OnagwxV7ILM4PLo2y-6NbU4e3v3u4-NYA966dWBnc/exec">Entrar</a>
  <p class="sub">Se pedirá iniciar sesión con la cuenta de Google autorizada.</p>
</main>
<script>location.replace(document.getElementById('go').href);</script>
</body>
</html>
